<script>
(function(){
'use strict';
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2=n=>Math.round(n*100)/100, r3=n=>Math.round(n*1000)/1000, r4=n=>Math.round(n*10000)/10000;
const fmt=n=>r3(n).toLocaleString('en-US',{maximumFractionDigits:3});
const WD=['日','一','二','三','四','五','六'];
/* ---------- Google 登入（畫面在 GitHub Pages，資料由 Apps Script 提供） ---------- */
const CFG=window.PREP_CFG||{},TK_KEY='prep_idtoken';
let TOKEN='';
const jwtExp=t=>{try{return JSON.parse(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).exp*1000}catch(e){return 0}};
const saveTok=t=>{TOKEN=t||'';try{t?localStorage.setItem(TK_KEY,t):localStorage.removeItem(TK_KEY)}catch(e){}};
try{const t=localStorage.getItem(TK_KEY)||'';if(t&&jwtExp(t)>Date.now()+120000)TOKEN=t;}catch(e){}
const waitGis=()=>new Promise(res=>{let n=0;(function w(){if(window.google&&google.accounts&&google.accounts.id)return res(true);if(++n>100)return res(false);setTimeout(w,100);})();});
async function drawGbtn(el,cb){
  if(!await waitGis()){el.innerHTML='<p class="mut">Google 登入元件載入失敗，請檢查網路後重新整理。</p>';return;}
  google.accounts.id.initialize({client_id:CFG.clientId,callback:r=>{saveTok(r.credential);cb();},auto_select:false,use_fedcm_for_prompt:true});

function card3(i){

function step3(){

function card4(i){

      <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm ${S.hist[e.pid]?'':'ghost'}" data-a="toolHist" data-i="${i}">${S.hist[e.pid]?'以前調整過，叫出來沿用':'叫出以前的器具'}</button>${Array.isArray(e.tools)?`<button class="btn sm ghost" data-a="treset" data-i="${i}">還原成模板</button>`:''}${same?`<button class="btn sm ghost" data-a="tcopy" data-i="${i}">套用到同一個產品的其他 ${same} 堂</button>`:''}</div></div>`:''}</div>`;

function stepTools(){

  +gs.map((g,n)=>`<div class="gwrap">${gHead('4',g,n,`${g.idx.length} 堂課・已確認 ${g.idx.filter(i=>S.seen4.has(eKey(S.entries[i]))).length}/${g.idx.length}`,g.idx.every(i=>S.seen4.has(eKey(S.entries[i])))?'done':'todo')}${gIsOpen('4',g,n)?`<div class="gbody">${g.idx.map(card4).join('')}</div>`:''}</div>`).join('')

function step5(){

  const addU=(arr,date,teacher,title,qty)=>{let u=arr.find(z=>z.date===date&&z.teacher===teacher);if(!u){u={date,teacher,titles:[],qty:0};arr.push(u);}if(title&&!u.titles.includes(title))u.titles.push(title);if(qty===null||u.qty===null)u.qty=null;else u.qty+=qty;};
  const out=t.materials.map(m=>{const us=[];(m.uses||[]).forEach(u=>{const ts=(u.items||[]).map(i=>i.title).filter(Boolean);if(!ts.length&&u.course)ts.push(u.course);addU(us,u.date,u.teacher||'',ts[0]||'',typeof u.qty==='number'?u.qty:null);const x=us.find(z=>z.date===u.date&&z.teacher===(u.teacher||''));ts.forEach(q=>{if(!x.titles.includes(q))x.titles.push(q);});});return {key:'m|'+m.std+'|'+m.unit,kind:'材料',name:m.std,qty:m.total,unit:m.unit==='g'?'克':m.unit,uses:us};});
  const tm={};
  (t.tools||[]).forEach(d=>d.items.forEach(x=>{if(x.n===null)return;const k='t|'+x.name+'|'+x.unit;const o=tm[k]=tm[k]||{key:k,kind:'器具',name:x.name,qty:0,unit:x.unit,uses:[]};o.qty+=x.n;(x.uses||[]).forEach(u=>{const mm=String(u.qty||'').match(/[\d.]+/);addU(o.uses,d.date,u.teacher||'',u.title||u.course||'',mm?Number(mm[0]):null);});}));
  return out.concat(Object.values(tm));
}

function download(name,b64,auto=true){

  const url=URL.createObjectURL(new Blob([u8],{type:/\.pdf$/i.test(name)?'application/pdf':'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
  if(auto){const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();}
  return {name,url};
}

/* 伺服器給排好的 HTML，在這個瀏覽器裡轉成 PDF（用這台電腦的標楷體；沒有的話用楷體系網頁字型） */
const prog=(msg)=>{let d=document.getElementById('pdfProg');if(!msg){if(d)d.remove();return;}if(!d){d=document.createElement('div');d.id='pdfProg';d.style.cssText='position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:#1d3a2f;color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;z-index:98;box-shadow:0 4px 14px rgba(0,0,0,.25);max-width:92vw;text-align:center';document.body.appendChild(d);}d.textContent=msg;};
async function htmlToPdf(html,tag){
  if(!document.getElementById('kaiFont')){const l=document.createElement('link');l.id='kaiFont';l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC&display=swap';document.head.appendChild(l);}
  await Promise.all([loadJs('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js'),loadJs('https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js')]);
  const host=document.createElement('div');host.style.cssText='position:fixed;left:-99999px;top:0;background:#fff';
  host.innerHTML=new DOMParser().parseFromString(html,'text/html').body.innerHTML;document.body.appendChild(host);
  try{
    try{await Promise.race([document.fonts.load('16px "LXGW WenKai TC"','標楷體實習材料單'),new Promise(r=>setTimeout(r,6000))]);}catch(e){}
    try{await document.fonts.ready;}catch(e){}
    const {jsPDF}=window.jspdf,pdf=new jsPDF({unit:'pt',format:'a4'}),M=25.2,availH=841.89-M*2;let first=true;
    const kids=[...host.children],t0=Date.now();let done=0;
    for(const el of kids){
      const left=done?Math.round((Date.now()-t0)/done*(kids.length-done)/1000):0;
      prog(`${tag||''}PDF 製作中：第 ${done+1}／${kids.length} 頁${done?`（約剩 ${left>=60?Math.floor(left/60)+' 分 '+(left%60)+' 秒':left+' 秒'}）`:'（保持這個頁面開著）'}`);
      await new Promise(r=>setTimeout(r,0));
      const SC=3,cv=await html2canvas(el,{scale:SC,backgroundColor:'#fff'}),w=cv.width/SC*0.75,sliceH=Math.floor(availH/0.75*SC);
      for(let y=0;y<cv.height;y+=sliceH){
        const hh=Math.min(sliceH,cv.height-y),c2=document.createElement('canvas');c2.width=cv.width;c2.height=hh;
        const g=c2.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c2.width,hh);g.drawImage(cv,0,y,cv.width,hh,0,0,cv.width,hh);
        if(!first)pdf.addPage();first=false;
        pdf.addImage(c2.toDataURL('image/png'),'PNG',M,M,w,hh/SC*0.75,undefined,'FAST');
      }
      done++;
    }
    return pdf.output('datauristring').split(',')[1];
  }finally{host.remove();}
}
/* PDF：用瀏覽器自己的「列印 → 另存為 PDF」（很快、字是向量不會糊、用這台電腦的標楷體）；要在列印視窗按一次儲存 */
function printHtml(name,html){
  return new Promise(async res=>{
    const f=document.createElement('iframe');f.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden';document.body.appendChild(f);
    const d=f.contentDocument,body=new DOMParser().parseFromString(html,'text/html').body.innerHTML,title=String(name).replace(/\.pdf$/i,'').replace(/[<>&]/g,'');
    d.open();d.write(`<!doctype html><html><head><meta charset="utf-8"><title>${title}</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC&display=swap"><style>@page{size:A4;margin:0.35in}html,body{margin:0;padding:0;background:#fff}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}</style></head><body>${body}</body></html>`);d.close();
    try{await Promise.race([f.contentWindow.document.fonts.ready,new Promise(r=>setTimeout(r,5000))]);}catch(e){}
    await new Promise(r=>setTimeout(r,300));
    const oldT=document.title;document.title=title;                                  // 列印視窗預設的檔名
    try{f.contentWindow.focus();f.contentWindow.print();}catch(e){}
    document.title=oldT;setTimeout(()=>{f.remove();res();},800);
  });
}
async function runFmt(fn,...args){
  const f=S.dlfmt||'xlsx',got=[];let printed=0,last='';
  try{
    for(const x of (f==='both'?['xlsx','pdf']:[f])){
      prog(x==='pdf'?'正在準備 PDF 內容（伺服器處理中）…':'正在準備 Excel…');const r=await run(fn,...args,x);
      const fl=r.files||[r],np=fl.filter(q=>q.html).length;let k=0;
      for(const q of fl){
        if(q.html){k++;prog(`請在跳出的列印視窗，目的地選「另存為 PDF」，按「儲存」${np>1?`（第 ${k}／${np} 個檔）`:''}`);await printHtml(q.name,q.html);printed++;last=q.name;}
        else got.push(q);
      }
    }
  }finally{prog('');}
  if(!got.length)return {name:last||'PDF',url:''};
  if(got.length===1&&!printed)return deliver(got[0]);                         // 只有一個檔：直接下載
  const list=got.map(q=>q.previewHtml?{name:q.name,url:''}:download(q.name,q.base64,false));
  if(got.length===1){return deliver(got[0]);}
  S.dlFiles=list;return list[list.length-1];
}

function stageCell(tid,w,cl,day,cell){

async function commitSched(after){

  let saved=0;

async function runImport(pairs,srcTid,over){
  const t=schedTable(S.sc.tab),skip0=[],use=[];
  pairs.forEach(p=>{
    const tc=t.classes.find(x=>x.cls===p.tc);let d=+p.td||0;if(tc&&clDays(tc).length===1&&d===clDays(tc)[0])d=0;
    const wk=tWeeks(t).find(x=>x.n===p.tw);
    if(tc&&wk&&!over&&schedCell(t.id,p.tw,p.tc,d))skip0.push(`${p.tc} ${wk.label}：已經有內容，沒有換掉`);else use.push(p);
  });
  try{
    let staged=[],skipped=skip0;
    if(use.length){const r=await run('apiScheduleImport',t.id,srcTid,use,true,true);staged=r.staged;skipped=skip0.concat(r.skipped);}
    staged.forEach(x=>stageCell(t.id,x.week,x.cls,x.day,x.cell));

}

function gridHTML(t,H){
  const cellAt=(w,cl,day)=>H?H.cell(w,cl,day):schedCell(t.id,w,cl,day);
  const d=S.sc.data,gl=t.groups||[],gN=Math.max(1,gl.length),me=S.user.email,single=t.classes.length===1,reg=single?clDays(t.classes[0]):[0];
  const dayKey=(c,x)=>{const rd=clDays(c);return rd.length===1&&x===rd[0]?0:x;};             // 只有一天上課的班，平常那一天的格子存成 0
  const rowDays=w=>{                                                                          // 這一週要列哪幾天：平常上課日 + 這週加練的日子
    if(!single)return [0];const c=t.classes[0],out=reg.slice();
    for(let x=1;x<=7;x++)if(!reg.includes(x)&&cellAt(w.n,c.cls,x))out.push(x);
    return out.sort((a,b)=>a-b);};
  const td=(w,c,x)=>{
    const day=single?dayKey(c,x):0,cell=cellAt(w.n,c.cls,day),cls='sc'+((!H&&pendMap()[pkey(t.id,w.n,c.cls,day)])?' pd':'');

    const at=`data-a="${H?'hCopyCell':wkClip?'scPasteWeek':pm?'scPaste':'scEdit'}" data-w="${w.n}" data-cl="${esc(c.cls)}" data-d="${day}"`;
    const cp=(pm||H)?'':`<button class="cp" data-a="scCopyClip" data-w="${w.n}" data-cl="${esc(c.cls)}" data-d="${day}" title="複製這一格，再點別的格子貼上">⧉</button>`;
    const dr=H?'':` draggable="true"`;
    if(!cell){
      if(H)return `<td class="sc empty" colspan="${gN}"></td>`;
      const pv=!pm&&gl.length>=2&&prevLesson(t,c.cls,w.n,day);
      return `<td class="${cls} empty" colspan="${gN}" ${at}>${pv?`<button class="sw" data-a="scSwap" data-w="${w.n}" data-cl="${esc(c.cls)}" data-d="${day}" title="接上一次有實習的那週，單雙互換">⇄ 接上週互換</button>`:(pm?'貼上':'＋')}</td>`;
    }
    if(cell.kind==='note')return `<td class="${cls} note" colspan="${gN}" ${at}${dr}>${esc(cell.note)}${cp}</td>`;
    const one=g=>`${esc(cell.label||g.pids.map(pTitle).join('、'))}<small>${esc(uName(g.teacher))}</small>`;
    if(cell.mode==='joint'||gN===1){const g=cell.groups[0];return `<td class="${cls}${g.teacher===me?' me':''}" colspan="${gN}" ${at}${dr}>${one(g)}${cp}</td>`;}
    return cell.groups.map((g,gi)=>`<td class="${cls}${g.teacher===me?' me':''}" ${at}${dr}>${g.pids.length?one(g):''}${gi===0?cp:''}</td>`).join('');
  };
  const perDay=single;
  let rows='';
  const wf=S.sc.wf||'all';
  (H?H.weeks:tWeeks(t)).filter(w=>H||wf==='all'||(wf==='vac'?w.vac:!w.vac)).forEach(w=>{
    const dr=perDay?rowDays(w):[0];
    dr.forEach((x,di)=>{
      const ex=perDay&&!reg.includes(x);
      rows+=`<tr>${di===0?`<th class="wkc ${w.vac?'vac':''}" rowspan="${dr.length}" ${!H&&S.sc.clip&&S.sc.clip.tid===t.id&&S.sc.clip.kind==='week'?`data-a="scPasteWeek" data-w="${w.n}" style="cursor:pointer"`:''}>${w.vac?'假':w.n}${H?`<button class="ad" data-a="hCopyWeek" data-w="${w.n}" title="複製這一週（全部班級）">⧉整週</button>`:(perDay&&d.canEditCells!==false?`<button class="ad" data-a="scAddDay" data-w="${w.n}" title="這一週額外加一天">＋日</button>`:'')}${perDay?'<small>'+md(w.mon)+'起</small>':`<small>${w.label.replace('~','<br>~')}</small>`}</th>`:''}${perDay?`<th class="dtc">${md(addDays(w.mon,x-1))}${ex?'<small>加練</small>':''}</th>`:''}${t.classes.map(c=>td(w,c,x)).join('')}</tr>`;
    });
  });
  const many=!H&&t.classes.length*gN>4,ncol=t.classes.length*gN;
  return `<div class="sgw"><table class="sgrid ${S.sc.clip&&S.sc.clip.tid===t.id?'pm':''}" ${many?`style="width:${Math.round(62+(perDay?74:0)+ncol*(gN>1?72:92))}px;max-width:none"`:''}><colgroup><col style="width:3.9em">${perDay?'<col style="width:4.6em">':''}${many?Array(ncol).fill(`<col style="width:${gN>1?72:92}px">`).join(''):''}</colgroup><thead><tr><th rowspan="${gN>1?2:1}">週</th>${perDay?`<th rowspan="${gN>1?2:1}">日</th>`:''}${t.classes.map(c=>`<th colspan="${gN}">${esc(c.cls)}<small>${daysText(clDays(c),true)}</small></th>`).join('')}</tr>${gN>1?`<tr>${t.classes.map(()=>gl.map(l=>`<th class="g">${esc(l)}</th>`).join('')).join('')}</tr>`:''}</thead><tbody>${rows}</tbody></table></div>`;

function mkGroups(t,mode,me0){

function pickTabs(){return [...GRADES.map(g=>[g,gname(g)]),...(S.cat.categories||[]).map(n=>['c:'+n,n]),['共','共用'],['自','我自創的']];}
function browseList(tab){
  const half=S.term.endsWith('-2')?'下':'上',all=usableProducts();

  if(tab==='自')return {flat:all.filter(p=>p.custom&&p.owner===S.user.email)};
  if(tab.startsWith('c:'))return {flat:all.filter(p=>p.category===tab.slice(2))};
  const l=all.filter(p=>gradeOf(p)===tab);

function histSummary(pid,x){
  const its=S.cat.items[pid]||[],by=id=>its.find(i=>i.id===id),out=[];
  if(x.title)out.push('產品名稱：'+x.title);
  if(x.scale&&x.scale!==1)out.push(`份量 ×${fmt(x.scale)}${x.yFrom&&x.yTo?`（每組 ${fmt(x.yFrom)} → ${fmt(x.yTo)}${x.yUnit||''}）`:''}`);
  Object.keys(x.ov||{}).forEach(id=>{const it=by(id);if(it)out.push(`${it.raw} 改成 ${fmt(x.ov[id])}${it.unit||''}`);});
  Object.keys(x.conv||{}).forEach(id=>{const it=by(id),c=x.conv[id];if(it)out.push(`${it.raw} 改成 ${c.mode==='text'?c.text:fmt(c.mode==='per'?c.per:c.total)+(c.unit||'')}`);});
  (x.extra||[]).forEach(r=>out.push('另加：'+r.raw));
  (x.omit||[]).forEach(id=>{const it=by(id);if(it)out.push('刪掉：'+it.raw);});
  return out;
}

function rqCounts(rq){const l=rq.filter(x=>!x.skip);return {n:l.length,done:l.filter(x=>x.state==='done').length,pending:l.filter(x=>x.state==='pending').length,partial:l.filter(x=>x.state==='partial'||x.state==='empty').length,none:l.filter(x=>x.state==='no-table').length};}

  if(!d.canConfig)return '';                                   // 有沒有建進度表，只有技士、科主任、管理者看得到，一般老師不用看
  const rq=d.required||[];
  const c=rqCounts(rq);
  let h=`<div class="card"><div class="cb" style="padding-top:12px"><b>${esc(d.term)} 學期，應該要有的進度表</b>${rq.length?`<small class="mut" style="display:block">共 ${c.n} 門：全部送出 ${c.done}${c.pending?`・<b style="color:#6B4E00">有課還沒送 ${c.pending}</b>`:''}${c.partial?`・<b style="color:#6B4E00">進度表還沒排完 ${c.partial}</b>`:''}${c.none?`・<b style="color:var(--err)">還沒開始排 ${c.none}</b>`:''}</small>`:'<p class="mut" style="margin:6px 0 0">還沒設定。技士、科主任、管理者可以設定「每學期應該要有哪些課程和班級的進度表」，設定一次，以後每學期都照這份清單。</p>'}`;
  h+=`<div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm ghost" data-a="rqToggle">${S.sc.rqOpen?'收起清單':'看每門課排到哪'}</button><button class="btn sm ghost" data-a="rqOpen">設定每學期要有哪些進度表</button></div>`;
  if(!S.sc.rqOpen)return h+'</div></div>';
  h+=rq.map(x=>`<div class="prow"><b>${esc(x.dept)}・${esc(x.course)}</b> <span class="tg" style="background:${RQ_BG[x.state]}">${RQ_TXT[x.state]}</span>${x.note?` <small class="mut">${esc(x.note)}</small>`:''}
    <div style="margin-top:4px">${x.classes.map(k=>`<span class="pchip2" style="background:${x.skip?'#E9EEEC':RQ_BG[k.state]}">${esc(k.cls)}　${x.skip?'－':rqClassText(k)}</span>`).join('')}</div>
    <div class="mut" style="margin-top:4px;font-size:13px">授課老師（要提醒的人）：${(()=>{const ra=(d.requiredAll||[]).find(y=>y.id===x.id);return ra?reqTeachNames(ra):'<span class="mut">－</span>';})()}</div>
    <div style="margin-top:4px;display:flex;gap:8px;flex-wrap:wrap">${d.canConfig?`<button class="btn sm ghost" data-a="rqSkip" data-id="${esc(x.id)}" data-v="${x.skip?'0':'1'}" ${S.rqBusy?'disabled':''}>${S.rqBusy===x.id?'⏳ 處理中，請稍等…':(x.skip?'恢復（這學期要開）':'這學期不開')}</button>`:''}</div></div>`).join('');
  return h+'</div></div>';
}
function rqModal(){
  const q=S.rq,d=S.sc.data,f=q.form;
  const clText=c=>`${esc(c.cls)}（${daysText(c.days,true)}）`;
  if(!f)return `<div class="modal"><div class="mb"><h2 style="margin:0 0 6px">每學期要有哪些進度表</h2><p class="mut" style="margin:0 0 8px">設定一次，每學期都照這份清單自動建好進度表。同一門課、同一班只會有一張，老師只能在裡面共同編輯，不能自己新增。</p>
    ${(d.requiredAll||[]).map(x=>`<div class="parow"><span>${esc(x.dept)}・${esc(x.course)} <span class="tg gr">${{'每':'每學期','上':'上學期','下':'下學期','假':'只有寒暑假'}[x.half]||x.half}</span><small>${x.classes.map(clText).join('、')}${x.groups&&x.groups.length?'　分組：'+esc(x.groups.join('、')):''}${x.note?'　'+esc(x.note):''}<br>授課老師：${reqTeachNames(x)}</small></span><span>${q.delAsk===x.id?`<button class="btn danger sm" data-a="rqDelYes" data-id="${esc(x.id)}">確定刪除</button> <button class="btn ghost sm" data-a="rqDelNo">取消</button>`:`<button class="btn sm ghost" data-a="rqEdit" data-id="${esc(x.id)}">修改</button> <button class="btn sm ghost" data-a="rqDelAsk" data-id="${esc(x.id)}">刪除</button>`}</span></div>`).join('')||'<p class="mut">還沒有。</p>'}
    <div style="display:flex;gap:8px;justify-content:space-between;margin-top:10px"><button class="btn" data-a="rqNew">＋ 新增一門</button><button class="btn ghost" data-a="rqClose">關閉</button></div></div></div>`;
  const NO=['①','②','③','④'],jr0=f.course==='國中技藝班',cls=(S.classes[f.dept]||[]).filter(c=>jr0?/國中$/.test(c):!/國中$/.test(c)),courses=S.courses[f.dept]||[],one=f.classes.length===1,jr=jr0,W=jr?'哪一所國中（每一所國中一張獨立的進度表）':'哪些班',W2=jr?'國中':'班';
  return `<div class="modal"><div class="mb"><h2 style="margin:0 0 8px">${f.id?'修改：'+esc(f.dept)+'・'+esc(f.course):'新增一門要排進度表的課'}</h2>
    ${f.id?'':`<div class="rqsec"><b class="rqh">部別</b><div class="seg">${DEPTS.map(x=>`<button data-a="rqDept" data-d="${x}" class="${f.dept===x?'on':''}">${x}</button>`).join('')}</div></div>`}
    ${f.id?'':`<div class="rqsec"><b class="rqh">${NO[0]} 課程名稱</b><input class="in" style="width:100%" data-k="rqcourse" maxlength="20" placeholder="直接打課程名稱，例如：烘焙食品加工實習" value="${esc(f.course||'')}"><button class="btn sm ghost" style="margin-top:6px" data-a="rqCourse" data-c="國中技藝班">國中技藝班（選國中）</button></div>`}
    <div class="rqsec"><b class="rqh">${NO[1-(f.id?1:0)]} ${W}</b><div class="mut" style="font-size:13px;margin-bottom:4px">${jr?'一次選一所；要新增另一所，存好後再按「＋ 新增課程」':'同一門課、同一'+W2+'只能有一張進度表'}</div>${jr&&!cls.length?'<p class="mut" style="margin:4px 0">還沒有國中，請在下面「新增國中」打學校名稱，按「加入」。</p>':''}<div class="ccs">${cls.map(c=>f.clsDel?`<button class="cc" data-a="rqClsDel" data-cl="${esc(c)}" title="刪掉這個${W2}">✕ ${esc(c)}</button>`:`<button class="cc ${f.classes.some(x=>x.cls===c)?'on':''}" data-a="rqClass" data-cl="${esc(c)}">${esc(c)}</button>`).join('')}</div>
    <div style="display:flex;gap:6px;margin-top:6px;align-items:center"><input class="in" data-k="rqNewCls" maxlength="10" placeholder="${jr?'新增國中（例如：大村國中）':'新增班級'}" value="${esc(f.newCls||'')}" style="flex:1"><button class="btn sm" data-a="rqClsAdd">加入</button></div>
    <button class="linkb" data-a="rqClsMode">${f.clsDel?'完成（回去選）':'刪掉用不到的'+W2}</button></div>
    ${f.classes.length?`<div class="rqsec"><b class="rqh">${NO[2-(f.id?1:0)]} 每個${W2}的上課日、授課老師</b>${f.classes.map((c,ci)=>`<div class="rqcls" style="border-color:${ci%2?'#B65F00':'#1B6B54'}"><div class="rqct" style="background:${ci%2?'#B65F00':'#1B6B54'}">${esc(c.cls)}</div><div class="rqcb"><label class="lbl">每週上課日：<span class="mut">${esc(daysText(c.days))}</span></label><div class="ccs">${[1,2,3,4,5].map(n=>`<button class="cc ${c.days.includes(n)?'on':''}" data-a="rqDay" data-cl="${esc(c.cls)}" data-n="${n}">週${WDN[n]}</button>`).join('')}${one?`<button class="cc ${c.days.length===5?'on':''}" data-a="rqDay" data-cl="${esc(c.cls)}" data-n="all">每天</button>`:''}</div>${one?`<div class="rgrow" style="margin-top:6px"><label>從 <select class="in" data-k="rqFrom">${[1,2,3,4,5].map(n=>`<option value="${n}" ${Math.min(...c.days)===n?'selected':''}>週${WDN[n]}</option>`).join('')}</select></label><label>到 <select class="in" data-k="rqTo">${[1,2,3,4,5].map(n=>`<option value="${n}" ${Math.max(...c.days)===n?'selected':''}>週${WDN[n]}</option>`).join('')}</select></label></div>`:''}
      <label class="lbl" style="margin-top:10px">這個${W2}的授課老師（可以選好幾位；都不選 = 只有技士、科主任、管理者能編輯）</label><div class="ccs">${S.sc.data.users.map(u=>`<button class="cc ${(c.teachers||[]).includes(u.email)?'on':''}" data-a="rqTeach" data-cl="${esc(c.cls)}" data-em="${esc(u.email)}" aria-pressed="${(c.teachers||[]).includes(u.email)}">${esc(u.name)}</button>`).join('')}</div></div></div>`).join('')}
      <p class="mut" style="margin:6px 0 0;font-size:13px">${one?'只有一個'+W2+'的話可以選好幾天，或用「從…到…」選週幾到週幾。某一週想額外加一天，到進度表按那一週的「＋日」。':'一個'+W2+'一天。每學期上課日不一樣的話，之後到進度表按「修改上課日、分組」改。'}</p></div>`:''}
    <div class="rqsec"><b class="rqh">${NO[3-(f.id?1:0)]} 其他設定</b><div class="mut" style="font-size:13px;margin-bottom:4px">單數組、雙數組怎麼分，由老師在進度表每一格自己選，這裡不用設。</div>
    <label class="lbl" style="margin-top:8px">哪個學期要有</label>${f.half==='假'?'<p class="mut" style="margin:0 0 4px">只有寒暑假：每學期都建一張進度表，但清單只看寒暑假加的那幾週，學期內沒排也不會顯示還沒排完。</p>':''}<div class="seg">${[['每','每學期'],['上','只有上學期'],['下','只有下學期'],['假','只有寒暑假']].map(([v,n])=>`<button data-a="rqHalf" data-h="${v}" class="${f.half===v?'on':''}">${n}</button>`).join('')}</div>
    <label class="lbl" style="margin-top:8px">備註（可以不填）</label><input class="in" style="width:100%" data-k="rqnote" maxlength="30" value="${esc(f.note)}"></div>
    ${f.err?`<div class="err" style="margin-top:10px">${esc(f.err)}</div>`:''}
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px"><button class="btn ghost" data-a="rqBack">取消</button><button class="btn" data-a="rqSave"${f.busy?' disabled':''}>${f.busy?'儲存中…':'儲存'}</button></div></div></div>`;
}

/* ---------- 開始 ---------- */
function denyScreen(msg){
  $('#app').innerHTML=`<div class="deny"><h2>員林農工材料單系統</h2><p>${msg}</p><button class="btn" data-a="signout">切換帳號</button><button class="btn ghost" onclick="location.reload()">重新整理</button><p class="mut" style="margin:14px 0 0">換帳號後還是進不來的話，請管理者到「後台 → 使用者」把你的信箱加進名單。</p></div>`;
}
const jwtEmail=t=>{try{return JSON.parse(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).email||'';}catch(e){return '';}};
const fixTab=()=>{const d=S.sc.data;if(d&&d.tables&&(!S.sc.tab||!d.tables.some(t=>t.id===S.sc.tab)))S.sc.tab=(d.tables[0]||{}).id||'';};
function applyBoot(d,first){
  S.trial=!!d.trial;S.user=d.user;S.term=d.term;S.cat=d.catalog;S.classes=d.catalog.classes||S.classes;S.courses=d.catalog.courses||{'日間部':[],'夜間部':[]};S.cat.pmap={};S.cat.products.forEach(p=>S.cat.pmap[p.pid]=p);
  refreshStd();S.adminUrl=d.adminUrl||'';S.accepting=d.open!==false;S.openNote=d.openNote||'';
  S.extraOpen=d.extraOpen===true;S.extraNote=d.extraNote||'';
  if(!first&&dirty())return;                       // 已經動手改了就不要蓋掉
  S.entries=d.entries.map(norm);S.hist=d.hist||{};S.sel=new Set(S.entries.map(e=>K(e.dept,e.course,e.pid)));S.savedSig=sigOf(S.entries);S.sentAt=S.entries.map(e=>e.updated).filter(Boolean).sort().pop()||'';seedSeen();
  if(!first)return;
  S.dept=(S.entries[0]&&S.entries[0].dept)||'日間部';S.course=(S.entries[0]&&S.entries[0].course)||(S.courses[S.dept]||[])[0]||'';
  const t0=today(),w0=weekStart(t0);S.rgFrom=w0;S.rgTo=addDays(w0,6);
  S.view=S.user.role==='技士'?'tech':'sched';S.step=S.entries.some(e=>e.sid)?3:0;S.sstep=S.step;S.estep=1;
  if(S.entries.some(e=>e.sid))S.info=`已載入你的 ${S.entries.filter(e=>e.sid).length} 堂進度表的課。要改別的地方，直接點上面的步驟。`;
}
async function runDiag(){
  const o=document.createElement('div');o.style.cssText='position:fixed;inset:0;z-index:99999;background:#fff;color:#000;overflow:auto;padding:16px;font:13px/1.5 monospace;white-space:pre-wrap';
  o.textContent='測速中，請等約 1 分鐘…';document.body.appendChild(o);
  const L=[];const t=async(fn,...a)=>{const t0=Date.now();try{const d=await run(fn,...a);const w=window.__last||{};L.push(fn+'：總共 '+(Date.now()-t0)+' ms，伺服器 '+w.server+' ms');return d;}catch(e){L.push(fn+' 失敗：'+e.message);}};
  await t('apiHello');await t('apiBootstrap');await t('apiBootstrap');await t('apiScheduleGet','');await t('apiScheduleGet','');
  const p=await t('apiProfile');
  if(p){L.push('--- 每張分頁讀取（ms）');p.sheets.forEach(x=>L.push(x.name+'：'+x.ms+' ms（'+x.rows+' 列 × '+x.cols+' 欄）'));L.push('--- 各階段（ms）');p.phases.forEach(x=>L.push(x.name+'：'+x.ms));}
  o.textContent=L.join('\n');
  const b=document.createElement('button');b.textContent='關閉';b.style.cssText='display:block;margin:12px 0;padding:8px 16px';b.onclick=()=>o.remove();o.appendChild(b);
}
async function boot(){
  if(!TOKEN)return loginScreen();
  const em=jwtEmail(TOKEN);let cache=null;
  try{const c=JSON.parse(localStorage.getItem('prep_cache')||'null');if(c&&em&&c.em===em&&c.boot&&c.boot.user&&c.boot.catalog)cache=c;}catch(e){}
  const pHello=run('apiHello'),pBoot=run('apiBootstrap'),pSched=run('apiScheduleGet','');   // 三個一起問，不排隊
  pBoot.catch(()=>{});pSched.catch(()=>{});
  let shown=false;
  if(cache){try{applyBoot(cache.boot,true);if(cache.sched){S.sc.data=cache.sched;fixTab();}shown=true;render();}catch(e){shown=false;}}   // 先用上次的資料秒開，背景再更新
  try{
    const h=await pHello;S.appUrl=h.appUrl||'';
    if(!h.email)return denyScreen('沒有抓到你的帳號，請重新登入。');
    if(!h.listed){try{localStorage.removeItem('prep_cache');}catch(e){}return denyScreen(`你目前登入的帳號是 <b>${esc(h.email)}</b>，這個帳號<b>還沒有被加入系統</b>，不能使用。<br>請切換成學校帳號，或請管理者把這個信箱加進來。`);}
    const d=await pBoot;
    applyBoot(d,!shown);
    render();
    if(S.view==='tech'){loadRange();}
    else{
      if(!S.sc.data){S.sc.busy=true;render();}
      let sd=null;try{sd=await pSched;S.sc.data=sd;fixTab();}catch(e){if(!S.sc.data)S.err=e.message;}
      S.sc.busy=false;
      if(S.step===0||!shown)render();
    }
    try{localStorage.setItem('prep_cache',JSON.stringify({em,boot:d,sched:S.sc.data||null}));}catch(e){}
    if(/[?&]diag\b/.test(location.search))runDiag();
  }catch(e){if(e.auth)return;if(shown){S.err=e.message;return render();}denyScreen(esc(e.message));}
}
boot();

})();
</script>
